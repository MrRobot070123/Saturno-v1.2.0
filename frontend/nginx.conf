server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Comprimir respuestas para mejorar rendimiento (regla #38).
    gzip on;
    gzip_types text/css application/javascript application/json;

    # SPA: cualquier ruta no encontrada como archivo cae en index.html
    # para que Angular Router la resuelva (evita rutas rotas al refrescar).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend dentro de la red de docker-compose, para que
    # el frontend no necesite conocer el host real del backend en producción.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
